# Proposed CI gate (NOT run on GitHub in this delivery). Pin reviewed action commits before production use.
name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: ci }
        ports: ['5432:5432']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - run: npm install --no-audit --no-fund && npx playwright install --with-deps chromium
      - run: pip install openapi-spec-validator -r tools/audit/requirements-docs.txt
      - run: sudo apt-get update && sudo apt-get install -y postgresql-16 poppler-utils fonts-nanum
      - run: node content/build.mjs data && git diff --exit-code data/
      - run: node tools/gen_vectors.mjs && git diff --exit-code engine/tests/vectors/
      - run: node tools/gen_hash_vectors.mjs && git diff --exit-code engine/tests/vectors/canonical_hash_vectors.json
      - run: bash tools/run_all_checks.sh
      - run: npm run test:memory-ui
      - run: node engine/tests/fuzz_runs.mjs 100 full --late
      - run: node engine/tests/balance_probe.mjs 350 --late --out reports/paired_balance_late.json
      - run: node tools/review/balance_causes.mjs reports/paired_balance_late.json reports/paired_balance_causes.json
      - run: npm run test:late-ui
      - run: python3 tools/check_integrated_release.py
